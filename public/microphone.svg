<svg id="svg1" version="2" viewBox="0 0 1488.8 1032.2" xmlns="http://www.w3.org/2000/svg" xmlns:cc="http://creativecommons.org/ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#">
  <title id="title1">Mic</title>
  <defs id="defs1">
    <style id="style1">
      :root {
        color-scheme: light dark;
        paint-order: stroke fill markers;
      }
      #mic {
        fill: light-dark(silver, #3d525c);
        stroke: light-dark(#2a2323, silver);
      }
      #shirt {
        animation: s-color alternate infinite 3s;
      }
      .notes {
        stroke-width: 50;
        animation: n-color alternate infinite 1s;
      }
      .notes:first-of-type {
        animation-name: s-color;
        animation-duration: 10s;
      }
      @keyframes j-color {
        from { fill: #951508 }
        to { fill: darkgreen }
      }
      @keyframes n-color {
        from { fill: #4a0458; stroke: #e4631b }
        to { fill: teal; stroke: hotpink }
      }
      @keyframes s-color {
        from { fill: #dbeb00; stroke: blue }
        25% { fill: cyan; stroke: aquamarine }
        50% { fill: orangered; stroke: crimson }
        75% { fill: chartreuse; stroke: gold }
        to { fill: coral; stroke: lavender }
      }
    </style>
  </defs>
