  <defs>
    <style>
      :root {
        color-scheme: light dark;
      }
      #jacket {
        animation: j-color alternate infinite 2s;
      }
      #shirt {
        animation: s-color alternate infinite 3s;
      }
      .notes {
        stroke-width: 250;
        paint-order:stroke fill markers;
        animation: n-color alternate infinite 1s;
      }
      @keyframes j-color {
        from { fill: #951508 }
        to { fill: darkgreen }
      }
      @keyframes n-color {
        from { fill: #4a0458; stroke: #e4631b }
        to { fill: teal; stroke: hotpink }
      }
      @keyframes s-color {
        from { fill: #dbeb00 }
        25% { fill: cyan }
        50% { fill: orangered }
        75% { fill: chartreuse }
        to { fill: coral }
      }
    </style>
  </defs>
